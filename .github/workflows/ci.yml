name: Public checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install formatter
        run: python -m pip install clang-format==18.1.8
      - name: C++ formatting
        shell: bash
        run: git ls-files -z '*.cpp' '*.hpp' '*.h' | xargs -0 clang-format --dry-run --Werror
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Node SDK tests
        run: node --test sdk/node/test.mjs
      - name: Explain private build boundary
        run: echo 'C++ builds use build.yml from the private CurlWrapper repository. Fork checks never receive private source or credentials.'
