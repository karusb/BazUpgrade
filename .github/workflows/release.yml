name: Publish validated release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag
        required: true
      bazupgrade-sha:
        description: Exact reviewed BazUpgrade commit
        required: true
      build-run:
        description: Successful BazUpgrade build.yml workflow_dispatch run ID
        required: true
      build-attempt:
        description: Validated BazUpgrade build attempt
        default: '1'
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate release input
        env:
          SHA: ${{ inputs.bazupgrade-sha }}
          RUN: ${{ inputs.build-run }}
          BUILD_ATTEMPT: ${{ inputs.build-attempt }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$BUILD_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.bazupgrade-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify existing tag and version
        env:
          SHA: ${{ inputs.bazupgrade-sha }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "$TAG^{commit}")" = "$SHA"
          test "$TAG" = "v$(tr -d '\r\n' < VERSION.txt)"
      - name: Download this repository's validated build packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.bazupgrade-sha }}
          RUN: ${{ inputs.build-run }}
          BUILD_ATTEMPT: ${{ inputs.build-attempt }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$BUILD_ATTEMPT" > run.json
          jq -e --arg sha "$SHA" --arg repo "$GITHUB_REPOSITORY" '.status == "completed" and .conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/build.yml" and .head_sha == $sha and .repository.full_name == $repo' run.json >/dev/null
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --pattern "packages-*-$BUILD_ATTEMPT" --dir validated
      - name: Verify source identity and platform completeness
        env:
          SHA: ${{ inputs.bazupgrade-sha }}
          BUILD_ATTEMPT: ${{ inputs.build-attempt }}
        run: |
          set -euo pipefail
          first="validated/packages-ubuntu-24.04-$BUILD_ATTEMPT/source.json"
          curl_sha="$(jq -r '.curlwrapper' "$first")"
          sdk_run="$(jq -r '.sdkRun' "$first")"
          sdk_attempt="$(jq -r '.sdkAttempt' "$first")"
          [[ "$curl_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$sdk_run" =~ ^[1-9][0-9]*$ ]]
          [[ "$sdk_attempt" =~ ^[1-9][0-9]*$ ]]
          for platform in ubuntu-24.04 windows-2025 macos-15; do
            identity="validated/packages-$platform-$BUILD_ATTEMPT/source.json"
            test -f "$identity"
            case "$platform" in ubuntu-*) os=Linux;; windows-*) os=Windows;; macos-*) os=macOS;; esac
            jq -e --arg sha "$SHA" --arg curl "$curl_sha" --arg run "$sdk_run" --arg attempt "$sdk_attempt" --arg os "$os" '.bazupgrade == $sha and .curlwrapper == $curl and .sdkRun == $run and .sdkAttempt == $attempt and .platform == $os' "$identity" >/dev/null
            test "$(find "validated/packages-$platform-$BUILD_ATTEMPT" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)" = 2
          done
      - name: Publish archives without replacing previous releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'An existing release must not be overwritten' >&2
            exit 1
          fi
          mkdir release
          find validated -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp -n {} release/ \;
          cd release
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          args=(--draft --verify-tag --generate-notes)
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" ./* "${args[@]}"
