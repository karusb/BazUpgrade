name: Build, test and package
on:
  workflow_dispatch:
    inputs:
      curlwrapper-sha:
        description: Reviewed immutable CurlWrapper SDK source commit
        type: string
        required: true
      sdk-build-run:
        description: Successful independent CurlWrapper SDK build run ID
        type: string
        required: true
      sdk-build-attempt:
        description: SDK build attempt to consume
        type: string
        default: '1'
        required: true
permissions:
  contents: read
jobs:
  build:
    name: C++ / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      BAZUPGRADE_REQUIRE_REFERENCE_TUF: '1'
    steps:
      - name: Validate immutable input references
        shell: bash
        env:
          CURL_REF: ${{ inputs.curlwrapper-sha }}
          SDK_RUN: ${{ inputs.sdk-build-run }}
          SDK_ATTEMPT: ${{ inputs.sdk-build-attempt }}
        run: |
          set -euo pipefail
          [[ "$CURL_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SDK_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$SDK_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout public BazUpgrade
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: bazupgrade
          persist-credentials: false
      - name: Install build dependencies and the reviewed SDK
        uses: ./bazupgrade/.github/actions/dependencies
        with:
          sdk-sha: ${{ inputs.curlwrapper-sha }}
          sdk-run: ${{ inputs.sdk-build-run }}
          sdk-attempt: ${{ inputs.sdk-build-attempt }}
          runner-image: ${{ matrix.os }}
          sdk-token: ${{ secrets.CURLWRAPPER_ARTIFACT_READ_TOKEN }}
      - name: Select CMake preset
        shell: bash
        run: |
          preset=release
          if [[ "$RUNNER_OS" == "Windows" ]]; then preset=windows; fi
          echo "BUILD_PRESET=$preset" >> "$GITHUB_ENV"
      - name: Configure BazUpgrade
        working-directory: bazupgrade
        run: cmake --preset ${{ env.BUILD_PRESET }}
      - name: Build BazUpgrade tools and SDK
        working-directory: bazupgrade
        run: cmake --build --preset ${{ env.BUILD_PRESET }} --parallel 4
      - name: C++ / CLI / C ABI / reference TUF tests
        working-directory: bazupgrade
        run: ctest --preset ${{ env.BUILD_PRESET }}
      - name: Node SDK tests
        working-directory: bazupgrade
        run: node --test sdk/node/test.mjs
      - name: Install SDK
        working-directory: bazupgrade
        run: cmake --install out/${{ env.BUILD_PRESET }} --config Release
      - name: Compile installed C++ consumer
        shell: bash
        run: |
          args=("-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/bazupgrade/out/installed;$BAZUPGRADE_DEPENDENCY_PREFIX;$CMAKE_PREFIX_PATH")
          if [[ "$RUNNER_OS" == "Windows" ]]; then args+=(-G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_INSTALLED_DIR=$BAZUPGRADE_VCPKG_INSTALLED_DIR" -DVCPKG_TARGET_TRIPLET=x64-windows-static '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'); fi
          cmake -S bazupgrade/examples/cpp -B consumer "${args[@]}"
          cmake --build consumer --config Release --parallel 4
      - name: Create release archives
        working-directory: bazupgrade
        run: cpack --preset ${{ env.BUILD_PRESET }}
      - name: Execute packaged binaries and verify public package contents
        shell: bash
        working-directory: bazupgrade
        run: cmake "-DPACKAGE_DIR=$PWD/out/packages" "-DTOOLS_CONFIG=$PWD/out/$BUILD_PRESET/package-tools-Release.cmake" -P cmake/VerifyPackages.cmake
      - name: Record release source identity
        shell: bash
        env:
          BAZ_REF: ${{ github.sha }}
          CURL_REF: ${{ inputs.curlwrapper-sha }}
          SDK_RUN: ${{ inputs.sdk-build-run }}
          SDK_ATTEMPT: ${{ inputs.sdk-build-attempt }}
        run: |
          printf '{"bazupgrade":"%s","curlwrapper":"%s","sdkRun":"%s","sdkAttempt":"%s","platform":"%s"}\n' "$BAZ_REF" "$CURL_REF" "$SDK_RUN" "$SDK_ATTEMPT" "$RUNNER_OS" > bazupgrade/out/packages/source.json
      - name: Install Linux analysis tools
        if: runner.os == 'Linux'
        run: python -m pip install gcovr==8.4
      - name: Configure coverage
        if: runner.os == 'Linux'
        working-directory: bazupgrade
        run: cmake --preset coverage
      - name: Build coverage
        if: runner.os == 'Linux'
        working-directory: bazupgrade
        run: cmake --build --preset coverage --parallel 4
      - name: Test coverage
        if: runner.os == 'Linux'
        working-directory: bazupgrade
        run: ctest --preset coverage
      - name: Report coverage
        if: runner.os == 'Linux'
        working-directory: bazupgrade
        run: gcovr --root . --filter '.*/(controllers|crypto|curl|publishing|storage|tuf|util)/' --json-summary out/coverage/summary.json --print-summary out/coverage
      - name: Configure sanitizers
        if: runner.os == 'Linux'
        working-directory: bazupgrade
        run: cmake --preset sanitizers
      - name: Build sanitizers
        if: runner.os == 'Linux'
        working-directory: bazupgrade
        run: cmake --build --preset sanitizers --parallel 4
      - name: Test ASan and UBSan behavior
        if: runner.os == 'Linux'
        working-directory: bazupgrade
        run: ctest --preset sanitizers -R bazupgrade.behavior
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: coverage-${{ github.run_attempt }}
          path: bazupgrade/out/coverage/summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packages-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            bazupgrade/out/packages/*.zip
            bazupgrade/out/packages/*.tar.gz
            bazupgrade/out/packages/source.json
          if-no-files-found: error
