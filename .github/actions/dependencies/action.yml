name: CMake build dependencies
description: Install platform dependencies and consume a reviewed prebuilt CMake SDK.
inputs:
  sdk-sha:
    description: Reviewed immutable SDK source commit
    required: true
  sdk-run:
    description: Successful SDK producer run ID
    required: true
  sdk-attempt:
    description: Exact SDK producer run attempt
    required: true
  runner-image:
    description: Expected runner image label
    required: true
  sdk-token:
    description: Read-only Actions token for the private SDK producer
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '24'
    - name: Build tools
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: 3.31.6
        ninjaVersion: 1.12.1
    - name: Interoperability test dependency
      shell: bash
      run: python -m pip install -r bazupgrade/requirements-tests.txt
    - name: Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libssl-dev libarchive-dev libcurl4-openssl-dev
    - name: macOS dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install openssl@3 libarchive curl
        echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3);$(brew --prefix libarchive);$(brew --prefix curl)" >> "$GITHUB_ENV"
    - name: Dependency environment
      shell: bash
      run: |
        echo "BAZUPGRADE_DEPENDENCY_PREFIX=$GITHUB_WORKSPACE/dependencies/installed" >> "$GITHUB_ENV"
        echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
        echo "BAZUPGRADE_VCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/dependencies/vcpkg_installed" >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: runner.os == 'Windows'
      with:
        repository: microsoft/vcpkg
        ref: 6fdd23fa0a9479a9f9a1c48178696f60cf39255d
        path: vcpkg
        persist-credentials: false
    - name: Bootstrap Windows dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
    - name: Download reviewed SDK artifact
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.sdk-token }}
        SDK_RUN: ${{ inputs.sdk-run }}
        SDK_ATTEMPT: ${{ inputs.sdk-attempt }}
        SDK_SHA: ${{ inputs.sdk-sha }}
      run: |
        set -euo pipefail
        [[ "$SDK_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$SDK_RUN" =~ ^[1-9][0-9]*$ ]]
        [[ "$SDK_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        test -n "$GH_TOKEN"
        mkdir -p dependencies/sdk-download
        gh api "repos/karusb/CurlWrapper/actions/runs/$SDK_RUN/attempts/$SDK_ATTEMPT" > dependencies/sdk-download/run.json
        node <<'JS'
        const assert = require("node:assert/strict");
        const run = require("./dependencies/sdk-download/run.json");
        assert.equal(run.status, "completed", "SDK build has not completed");
        assert.equal(run.conclusion, "success", "SDK build did not pass");
        assert.ok(["push", "workflow_dispatch"].includes(run.event), "Untrusted SDK build event");
        assert.equal(run.path, ".github/workflows/build.yml", "Unexpected SDK producer workflow");
        assert.equal(run.head_sha, process.env.SDK_SHA, "SDK source commit differs from the reviewed ref");
        assert.equal(String(run.id), process.env.SDK_RUN, "SDK run identity differs");
        assert.equal(String(run.run_attempt), process.env.SDK_ATTEMPT, "SDK run attempt differs");
        JS
        gh run download "$SDK_RUN" --repo karusb/CurlWrapper --name "sdk-$RUNNER_OS-$RUNNER_ARCH-$SDK_ATTEMPT" --dir dependencies/sdk-download
    - name: Verify and install SDK
      shell: bash
      env:
        SDK_RUN: ${{ inputs.sdk-run }}
        SDK_ATTEMPT: ${{ inputs.sdk-attempt }}
        SDK_SHA: ${{ inputs.sdk-sha }}
        EXPECTED_RUNNER: ${{ inputs.runner-image }}
      run: |
        set -euo pipefail
        node <<'JS'
        const assert = require("node:assert/strict");
        const fs = require("node:fs");
        const crypto = require("node:crypto");
        const directory = "dependencies/sdk-download/";
        const identity = JSON.parse(fs.readFileSync(directory + "source.json", "utf8"));
        assert.equal(identity.project, "CurlWrapper", "Unexpected SDK package");
        assert.equal(identity.commit, process.env.SDK_SHA, "SDK source commit differs");
        assert.equal(identity.run, process.env.SDK_RUN, "SDK producer run differs");
        assert.equal(identity.attempt, process.env.SDK_ATTEMPT, "SDK producer attempt differs");
        assert.equal(identity.os, process.env.RUNNER_OS, "SDK operating system differs");
        assert.equal(identity.arch, process.env.RUNNER_ARCH, "SDK architecture differs");
        assert.equal(identity.runner, process.env.EXPECTED_RUNNER, "SDK runner image differs");
        const expectedHash = fs.readFileSync(directory + "SHA256SUMS.txt", "utf8").trim().split(/\s+/)[0];
        assert.match(expectedHash, /^[0-9a-f]{64}$/, "Invalid SDK checksum");
        const archive = fs.readFileSync(directory + "CurlWrapper-SDK.zip");
        assert.equal(crypto.createHash("sha256").update(archive).digest("hex"), expectedHash,
                     "SDK archive checksum differs");
        JS
        cmake -E make_directory "$BAZUPGRADE_DEPENDENCY_PREFIX"
        cmake -E chdir "$BAZUPGRADE_DEPENDENCY_PREFIX" cmake -E tar xf "$GITHUB_WORKSPACE/dependencies/sdk-download/CurlWrapper-SDK.zip"
